[project]
name = "vehicular-blackbox-drowsiness"
version = "0.1.0"
description = "Raspberry Pi MediaPipe driver drowsiness and attention monitoring prototype"
requires-python = ">=3.11"
dependencies = [
    "mediapipe==0.10.18",
    "numpy==1.26.4",
    "jax==0.4.38",
    "jaxlib==0.4.38",
    "opencv-contrib-python==4.11.0.86",
    "gpiozero==2.0.1",
]

[project.scripts]
driver-drowsiness = "drowsiness_blackbox.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["."]
